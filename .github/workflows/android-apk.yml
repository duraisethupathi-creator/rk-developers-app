name: Build RK Developers Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: rk-developers-apk
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Setup Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Expo account from token
        run: eas whoami
      - name: Create or link EAS project
        run: eas init --force --non-interactive
      - name: Verify EAS project connection
        run: eas project:info
      - name: Build Android APK in Expo cloud
        run: eas build --platform android --profile preview --non-interactive --wait
